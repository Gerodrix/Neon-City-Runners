<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Neon City Runners</title>
    <style>
      body { margin: 0; background: #0a0a12; font-family: sans-serif; color: #e0e0ff; }
      #ui { display: flex; gap: 16px; align-items: center; padding: 12px; background: #14141f; }
      #ui span { font-size: 14px; }
      #spin-btn { background: #ff2e88; color: white; border: none; padding: 10px 24px; font-weight: bold; cursor: pointer; border-radius: 4px; }
      #spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      #fs-status { display: none; color: #33f2c7; font-weight: bold; font-size: 13px; }
      #bet-control { display: flex; align-items: center; gap: 6px; }
      #bet-control button { background: #333; color: #33f2c7; border: 1px solid #33f2c7; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-weight: bold; }
      #bet-control button:disabled { opacity: 0.4; cursor: not-allowed; }
      #bet-value { min-width: 40px; text-align: center; font-weight: bold; }
      #topup-control { display: flex; align-items: center; gap: 6px; }
      #topup-amount { width: 70px; background: #1a1a2a; color: #e0e0ff; border: 1px solid #33f2c7; border-radius: 4px; padding: 4px 6px; }
      #topup-btn { background: #333; color: #33f2c7; border: 1px solid #33f2c7; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
      #topup-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      #buy-bonus-btn { background: #6a1b8e; color: #fff; border: 1px solid #ff2e88; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
      #buy-bonus-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div id="ui">
      <span id="balance">Saldo: 1000</span>
      <div id="bet-control">
        <span>Apuesta:</span>
        <button id="bet-decrease" type="button">-</button>
        <span id="bet-value">1</span>
        <button id="bet-increase" type="button">+</button>
      </div>
      <span id="win">Último premio: 0</span>
      <button id="spin-btn">SPIN</button>
      <button id="buy-bonus-btn" type="button">Comprar Bonus (—)</button>
      <div id="topup-control">
        <input id="topup-amount" type="number" value="1000" min="1" step="1" title="Monto a recargar (demo)" />
        <button id="topup-btn" type="button">Cargar (demo)</button>
      </div>
      <span id="fs-status"></span>
    </div>
    <div id="pixi-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
